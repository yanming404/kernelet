# vOSTD: the OSTD-shaped API that the kernel proper is compiled against.
#
# The library is named `ostd` so that `hello` can depend on it as
# `ostd = { package = "vostd", ... }` and keep its source byte-identical to the
# Asterinas template.

[package]
name = "vostd"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "ostd"
path = "src/lib.rs"

[dependencies]
# The real macro crate from the Asterinas tree, unchanged (see ../libs).
ostd-macros = { path = "../libs/ostd-macros" }

typedio = { path = "../libs/typedio" }

# Same no_std logging facade and publication primitive as Asterinas OSTD.
log = "0.4"
spin = "0.10"
ostd-pod = { path = "../../../asterinas/ostd/libs/ostd-pod", default-features = false }
bitvec = { version = "1", default-features = false, features = ["alloc", "atomic"] }
smallvec = { version = "1", features = ["const_generics", "const_new", "union"] }

[lints]
workspace = true

[features]
asterinas = []
